[project]
name = "jqv"
version = "0.1.0"
description = "Qwen-based Decision API: shared-state, branch-isolated, non-generative probability readout (Jev-style PoC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=1.0",
    "datasets>=3.0",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "safetensors>=0.4",
    "peft>=0.21.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jqv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
